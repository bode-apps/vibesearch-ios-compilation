# Projet Xcode généré par XcodeGen (sur le Mac de GitHub) : `xcodegen generate`
name: VibeSearch
options:
  bundleIdPrefix: fr.vibe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: "YES"
      STRIP_INSTALLED_PRODUCT: "YES"
      COPY_PHASE_STRIP: "YES"
      DEBUG_INFORMATION_FORMAT: dwarf
targets:
  VibeSearch:
    type: application
    platform: iOS
    sources:
      - path: VibeSearch/Sources
      - path: VibeSearch/Ressources
        buildPhase: resources
      # Dossier tel quel (arborescence gardée) : extensions web, dont Bitwarden compilé sur GitHub
      - path: VibeSearch/ExtensionsWeb
        type: folder
        buildPhase: resources
      - path: VibeSearch/Assets.xcassets
    info:
      path: VibeSearch/Info.plist
      properties:
        CFBundleDisplayName: VibeSearch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: FondLancement
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Un site veut utiliser la caméra (visio, scan…). VibeSearch vous demande à chaque fois.
        NSMicrophoneUsageDescription: Un site veut utiliser le micro (visio, message vocal…). VibeSearch vous demande à chaque fois.
        NSPhotoLibraryAddUsageDescription: Pour enregistrer dans Photos les images que vous choisissez.
        NSFaceIDUsageDescription: Pour verrouiller VibeSearch ou le mode Fantôme avec Face ID.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [fr.vibe.search.releve]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: fr.vibe.search
            CFBundleURLSchemes: [vibesearch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vibe.search
        PRODUCT_NAME: VibeSearch
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        # Traduction : framework absent avant iOS 17.4 → lien faible (l'appli démarre quand même)
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "Translation"]
    scheme:
      testTargets: [VibeSearchUITests]
    dependencies:
      - target: PartageVibe
      - target: RedirectionSafari
      - target: WidgetVibe
      - target: ClavierVibe

  # « Partager › VibeSearch » dans toutes les applis
  PartageVibe:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Partage
    info:
      path: Extensions/Partage/Info.plist
      properties:
        CFBundleDisplayName: VibeSearch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PartageControleur
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vibe.search.partage
        PRODUCT_NAME: PartageVibe
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"

  # Extension Safari : les pages ouvertes dans Safari basculent dans VibeSearch
  RedirectionSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Safari/SafariWebExtensionHandler.swift
      - path: Extensions/Safari/Ressources
        buildPhase: resources
    info:
      path: Extensions/Safari/Info.plist
      properties:
        CFBundleDisplayName: VibeSearch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vibe.search.safari
        PRODUCT_NAME: RedirectionSafari
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"

  # Widgets (accueil, écran verrouillé) et bouton du Centre de contrôle
  WidgetVibe:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widget
    info:
      path: Extensions/Widget/Info.plist
      properties:
        CFBundleDisplayName: VibeSearch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vibe.search.widget
        PRODUCT_NAME: WidgetVibe
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"

  # Clavier « VibeSearch IA » : corriger, reformuler, traduire… le texte de n'importe quelle appli avec Claude
  ClavierVibe:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Clavier
    info:
      path: Extensions/Clavier/Info.plist
      properties:
        CFBundleDisplayName: VibeSearch IA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ClavierControleur
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: fr-FR
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vibe.search.clavier
        PRODUCT_NAME: ClavierVibe
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"

  # Tests d'interface (simulateur) : reproduction des bugs signalés
  VibeSearchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tests/UI
    dependencies:
      - target: VibeSearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vibe.search.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: VibeSearch
